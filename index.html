<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кухонный оркестратор</title>
  <meta name="description" content="Считает назад от времени подачи: что и когда ставить, чтобы всё поспело к одному моменту">
  <meta name="theme-color" content="#F4F5F3">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="ticket">
    <header class="masthead">
      <h1>Кухонный оркестратор</h1>
      <p class="tagline">считает назад от подачи · пищит, когда пора</p>
    </header>

    <section class="serve" aria-label="Время подачи">
      <label class="serve-label" for="serve-time">подача</label>
      <div class="serve-row">
        <input id="serve-time" type="time" autocomplete="off">
        <span id="tomorrow-flag" class="flag" hidden>завтра</span>
      </div>
    </section>

    <section class="dishes" aria-label="Блюда">
      <div id="items"></div>
      <button id="add-item" type="button" class="btn btn-add">+ Добавить блюдо</button>
    </section>

    <section class="board" aria-label="Таймлайн">
      <p id="hint" class="hint">добавь блюда и время подачи —<br>план соберётся сам</p>
      <div class="board-head">
        <p id="countdown" class="countdown" hidden></p>
        <button id="sound-toggle" type="button" class="btn btn-ghost"></button>
      </div>
      <ol id="timeline" class="timeline" hidden></ol>
      <button id="reset" type="button" class="btn btn-ghost btn-reset">Сброс</button>
    </section>

    <footer class="colophon">
      <p>ничего никуда не отправляется · всё в этом браузере</p>
    </footer>
  </main>

  <template id="item-row-tpl">
    <div class="item-row">
      <input class="item-name" type="text" placeholder="что готовим" autocomplete="off">
      <input class="item-minutes" type="number" min="1" max="1440" inputmode="numeric" placeholder="мин">
      <button class="item-remove" type="button" aria-label="Убрать">×</button>
    </div>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
